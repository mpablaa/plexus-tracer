// Muscle column (the actuators) — placed at the far right, grouped per nerve.
const BRANCH_MUSCLES = {

const MUSCLE_X = 985;
const MUSCLES = (() => {
  const out = [];
  ["Bmc", "Bax", "Brad", "Bmed", "Buln"].forEach(bid => {
    const list = BRANCH_MUSCLES[bid];
    const cy = NODES[bid].y;
    const gap = 30;
    const startY = cy - (list.length - 1) * gap / 2;
    list.forEach((m, i) => out.push({

}, {

  ant: "#f5a524",

function nodeBase(id) {
  const n = NODES[id];

// ---- propagation -----------------------------------------------------------
function propagate(cutSet) {
  const rec = {};
  ROOTS.forEach(r => rec[r] = cutSet.has(r) ? [] : [r]);
  const incoming = {};

  ORDER.forEach(id => {
    if (cutSet.has(id)) {
      rec[id] = [];

      state: have.length === 0 ? "dead" : ratio === 1 ? "full" : "weak",
